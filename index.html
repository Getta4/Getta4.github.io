        <style>
            html{
                font-display: swap;
            }
            #maincanvas{
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            #img_ico{
                height: 200px;

            /* ステータスアイコンのデザイン */
            .status-container {
                position: relative;
                display: inline-block;
            }
            .status-indicator {
                position: absolute;
                bottom: 12px;
                right: 5px;
                width: 40px;
                height: 40px;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                border-radius: 50%;
                z-index: 10;
            }

            /* ホバー時の設定など */
            .status-indicator::before,
            .status-indicator::after,
            .status-container::before,
            .status-container::after {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.2s ease, visibility 0.2s ease;
                pointer-events: none;
                z-index: 20;
            }

            /* 吹き出し本体 */
            .status-indicator::before,
            .status-container::before {
                content: attr(data-tooltip);
                background-color: #18191c;
                color: #dcddde;
                padding: 6px 10px;
                border-radius: 5px;
                font-size: 14px;
                font-family: sans-serif;
                white-space: nowrap;
            }

            /* 吹き出しのしっぽ（三角形） */
            .status-indicator::after,
            .status-container::after {
                content: '';
                border: 6px solid transparent;
            }

            /* ステータスアイコンのツールチップ位置 */
            .status-indicator::before, .status-indicator::after {
                bottom: 125%;
            }
            .status-indicator::after {
                border-top-color: #18191c;
                bottom: calc(125% - 11px);
            }

            /* プロフィールアイコンのツールチップ位置 */
            .status-container::before, .status-container::after {
                top: -25px;
            }
            .status-container::after {
                border-top-color: #18191c;
                top: 7px;
            }

            /* ホバー時にツールチップを表示 */
            .status-indicator:hover::before,
            .status-indicator:hover::after,
            .status-container:hover::before,
            .status-container:hover::after,
            .status-container.show-tooltip::before,
            .status-container.show-tooltip::after {
                opacity: 1;
                visibility: visible;
            }

            /* ステータスアイコンのホバー中は、親のツールチップを非表示にする（コピー中を除く） */
            .status-container:not(.copied):has(.status-indicator:hover)::before,
            .status-container:not(.copied):has(.status-indicator:hover)::after {
                opacity: 0;
                visibility: hidden;
            }

            /* Copied! のスタイル */
            .status-container.copied::before {
                background-color: #43a25a;
            }
            .status-container.copied::after {
                border-top-color: #43a25a;
            }

            /* ページスタイル */
            h1{
                font-size: 60px;
            }
            #ThankYou2024{
                font-size: 70px;
                margin: bottom 0;
            }

            }
            #headerLink {
                text-decoration: none;

            }
            #header {

            /* パソコン以外向けデザイン */

            @media (max-width: 960px) {

                }

            @media (max-width: 600px) {

        </style>

    <body id="dark">

        <script>
            let mode = document.body;

            // Cookieの操作関数
            function setCookie(name, value, days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                const expires = "expires=" + date.toUTCString();
                document.cookie = name + "=" + value + ";" + expires + ";path=/";
            }

            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for(let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            }

            // ページ読み込み時にCookieから設定を復元
            function loadTheme() {
                const savedTheme = getCookie('theme');
                if (savedTheme) {
                    if (savedTheme === 'light') {
                        setLightMode();
                    } else {
                        setDarkMode();
                    }
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setDarkMode();
                } else {
                    setLightMode();
                }
            }

            //テーマ関連関数
            
            const modePicture = document.getElementById("mode_change")
            const twitter = document.getElementById("twitter")
            const youtube = document.getElementById("youtube")
            const github = document.getElementById("github")

            function setDarkMode() {
                mode.id = "dark";
                twitter.src = "image/x_white.webp";
                youtube.src = "image/youtube_white.webp";
                github.src = "image/github_white.webp";
                modePicture.src = "image/lightmode.webp";
                setCookie('theme', 'dark', 365);
            }

            function setLightMode() {
                mode.id = "white";
                twitter.src = "image/x_dark.webp";
                youtube.src = "image/youtube_dark.webp";
                github.src = "image/github_dark.webp";
                modePicture.src = "image/darkmode.webp";
                setCookie('theme', 'light', 365);
            }

            function mode_change(){
                if(mode.id === "dark"){
                    setLightMode();
                }else{
                    setDarkMode();
                }
            }

            // ページ読み込み時の動作
            window.addEventListener('DOMContentLoaded', () => {
                loadTheme();//cokkieからテーマ復元

                const statusContainer = document.querySelector('.status-container');
                const statusIndicator = document.getElementById('discord-status');
                const originalTooltipText = 'Discord : get4_';
                const statusPresenceUrl = 'https://api.statusbadges.me/presence/957152000313786459';
                const statusImageMap = {
                    online: 'image/status/online.webp',
                    idle: 'image/status/idle.webp',
                    dnd: 'image/status/dnd.webp',
                    offline: 'image/status/offline.webp'
                };
                let isCopying = false;

                const showCopiedTooltip = () => {
                    statusContainer.setAttribute('data-tooltip', 'Copied!');
                    statusContainer.classList.add('copied');
                    statusContainer.classList.add('show-tooltip');

                    setTimeout(() => {
                        statusContainer.setAttribute('data-tooltip', originalTooltipText);
                        statusContainer.classList.remove('copied');
                        statusContainer.classList.remove('show-tooltip');
                        isCopying = false;
                    }, 1500);
                };

                const copyDiscordId = async () => {
                    const discordId = 'get4_';

                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(discordId);
                        return;
                    }

                    const tempTextarea = document.createElement('textarea');
                    tempTextarea.value = discordId;
                    tempTextarea.setAttribute('readonly', '');
                    tempTextarea.style.position = 'absolute';
                    tempTextarea.style.left = '-9999px';
                    tempTextarea.style.opacity = '0';
                    document.body.appendChild(tempTextarea);
                    tempTextarea.select();
                    tempTextarea.setSelectionRange(0, tempTextarea.value.length);
                    document.execCommand('copy');
                    document.body.removeChild(tempTextarea);
                };

                statusContainer.setAttribute('data-tooltip', originalTooltipText);
                statusIndicator.style.backgroundImage = `url("${statusImageMap.offline}")`;
                statusIndicator.setAttribute('data-tooltip', 'offline');

                const applyStatusImage = (titleText) => {
                    const normalizedTitle = titleText.trim().toLowerCase();
                    const match = normalizedTitle.match(/currently\s+(online|idle|dnd|offline)/);
                    const statusKey = match ? match[1] : normalizedTitle;
                    const statusImage = statusImageMap[statusKey] || statusImageMap.offline;
                    const statusLabel = statusKey === 'dnd'
                        ? 'Do not Distrab'
                        : statusImageMap[statusKey]
                            ? statusKey
                            : 'offline';

                    statusIndicator.style.backgroundImage = `url("${statusImage}")`;
                    statusIndicator.setAttribute('data-tooltip', statusLabel);
                    statusIndicator.setAttribute('data-status', statusKey);
                };

                fetch(statusPresenceUrl)
                    .then((response) => response.json())
                    .then((presenceData) => {
                        const statusText = presenceData?.status || '';

                        console.log('status presence:', statusText);

                        if (statusText) {
                            applyStatusImage(statusText);
                        }
                    })
                    .catch((error) => {
                        console.error('ステータス画像の取得に失敗しました:', error);
                    });

                //DiscordIDをコピー
                statusContainer.addEventListener('click', (event) => {
                    if (statusIndicator.contains(event.target)) {
                        return;
                    }

                    if (isCopying) return;

                    isCopying = true;

                    copyDiscordId().then(() => {
                        showCopiedTooltip();
                    }).catch((err) => {
                        isCopying = false;
                        console.error('クリップボードへのコピーに失敗しました:', err);
                    });
                });
            });
        </script>
